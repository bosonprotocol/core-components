name: "Set up the subgraph workspace"
description: "Install the monorepo dependencies and, when the built subgraph is needed, build them. The repository must already be checked out."

inputs:
  build:
    description: "Run the monorepo build. The deployment needs the workspace packages the subgraph manifest and mappings pull in; the './build' directory 'goldsky subgraph deploy' uploads is not produced here, but by the 'graph build' that the 'deploy:<env>:<network>' npm script runs itself. Tagging an already deployed version needs neither."
    required: false
    default: "true"
  workspace:
    description: "Install this workspace and the repository root only, rather than every workspace of the monorepo. A job that just runs a script out of one package has no use for the others - and cannot build, as what a build would need is not installed."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v3
      with:
        # Must stay on the Node (and so npm) version pinned by the root
        # package.json volta config: npm 11 and npm 10 resolve the root
        # typescript override differently, and no single lock file
        # satisfies both, so `npm ci` fails on whichever is out of step.
        node-version: "22"
        cache: "npm"
    - name: Turbo Cache
      if: inputs.build == 'true'
      uses: actions/cache@v3
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}
    - name: Install dependencies
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
      run: |
        set -euo pipefail
        if [ -n "$WORKSPACE" ]; then
          npm ci --workspace "$WORKSPACE" --include-workspace-root
        else
          npm ci
        fi
    - name: Build
      if: inputs.build == 'true'
      shell: bash
      run: npm run build -- --cache-dir=".turbo"
