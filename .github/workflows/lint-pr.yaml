name: "Lint PR"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  lint-pr:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@505e44b4f33b4c801f063838b3f053990ee46ea7 # v4.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          scopes: |
            common
            core-sdk
            eth-connect-sdk
            ethers-sdk
            ipfs-storage
            subgraph
            deps
            metadata
            react-kit
          subjectPattern: ^(?![A-Z]).+$
          validateSingleCommit: true
